name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase: [phase1-lexical-analysis, phase2-parser-and-tac]
    steps:
      - uses: actions/checkout@v4

      - name: Install flex and bison
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Build and test ${{ matrix.phase }}
        working-directory: ${{ matrix.phase }}
        run: make test
